<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DICOM Görüntüleyici: İndir</title>
<link rel="icon" href="icon-192.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1013;color:#e8eef5;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
.box{background:#151a1f;border:1px solid #252d35;border-radius:14px;padding:22px 24px;max-width:460px;width:100%}
h1{margin:0 0 4px;font-size:20px;color:#4cc2b0}
p{margin:8px 0;color:#9aa7b4}
#name{color:#e8eef5;font-weight:600;word-break:break-all}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
a.btn,button{font:inherit;font-weight:600;padding:9px 18px;border-radius:9px;border:1px solid #4cc2b0;background:#4cc2b0;color:#05201c;cursor:pointer;text-decoration:none}
a.btn.alt{background:transparent;color:#4cc2b0}
.err{color:#f2b84b}
</style>
</head>
<body>
<div class="box">
  <h1>DICOM GÖRÜNTÜLEYİCİ</h1>
  <p id="msg">Hazırlanıyor… / Preparing…</p>
  <p id="name"></p>
  <div class="row">
    <button id="again" type="button" hidden>Tekrar indir / Download again</button>
    <a class="btn alt" href="./">Web sürümünü aç / Open web version</a>
  </div>
</div>
<script>
(async function(){
  const msg=document.getElementById('msg'),nm=document.getElementById('name'),again=document.getElementById('again');
  const pad=n=>String(n).padStart(2,'0');
  function fdate(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');if(m)return m[3]+'.'+m[2]+'.'+m[1];const d=new Date();return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();}
  let url,name;
  function save(){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}
  try{
    const j=await (await fetch('version.json?t='+Date.now(),{cache:'no-store'})).json();
    const r=await fetch('DICOM_Goruntuleyici.html?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('http '+r.status);
    const t=await r.text();
    name='DICOM GÖRÜNTÜLEYİCİ_'+fdate(j.date)+'_'+j.version+'.html';
    url=URL.createObjectURL(new Blob([t],{type:'text/html;charset=utf-8'}));
    save();
    msg.textContent='İndirme başladı. Dosyayı İndirilenler klasöründen açın. / Download started. Open the file from your Downloads folder.';
    nm.textContent=name;again.hidden=false;again.onclick=save;
  }catch(e){
    msg.className='err';
    msg.innerHTML='İndirme hazırlanamadı. İnternet bağlantısını kontrol edip sayfayı yenileyin. / Could not prepare the download. Check your connection and reload.';
  }
})();
</script>
</body>
</html>
